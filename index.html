
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javier的储物间</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta name="theme-color" id="theme-color-meta" content="#ffffff">
    <style>
        /* 墨與白之間，萬物歸寂 */
        :root {
            --background-color: #ffffff;
            --text-color: #000000;
            --secondary-text-color: #666666;
            --font-family-main: 'Noto Serif SC', 'Source Han Serif SC', serif;
            --font-family-mono: 'SF Mono', Monaco, Menlo, Consolas, monospace;
        }

        /* 夜色降臨，反轉乾坤 */
        html[data-theme="dark"] {
            --background-color: #121212;
            --text-color: #e0e0e0;
            --secondary-text-color: #999999;
        }

        /* 身體如器，容納萬有 */
        body {
            font-family: var(--font-family-main);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* 天地之中，心之所在 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 主體，如蓮花初綻 */
        main {
            text-align: center;
            line-height: 2.5;
            letter-spacing: 2px;
            max-width: 600px;
            width: 100%;
        }

        /* 名號，如印章落紙 */
        h1 {
            font-weight: 500;
            font-size: 3rem;
            margin: 0 0 2rem 0;
            color: var(--text-color);
        }

        /* 思語，如水中漣漪 */
        p {
            font-size: 1.1rem;
            margin: 2rem auto;
            max-width: 20em;
            line-height: 2.2;
        }

        /* 座右銘，如心中明燈 */
        .motto {
            margin: 2rem 0 2.5rem 0;
        }

        .motto p {
            font-size: 0.95rem;
            color: var(--secondary-text-color);
            font-style: italic;
            line-height: 1.8;
            max-width: 24em;
        }

        /* 作品，如星辰點綴 */
        .works {
            margin: 2.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .works a {
            font-size: 1rem;
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
            line-height: 1.8;
        }

        .works a:hover {
            color: var(--secondary-text-color);
        }

        /* 聯繫，質樸如初 */
        .contact {
            font-size: 0.9rem;
            font-family: var(--font-family-main);
            color: var(--secondary-text-color);
            margin-top: 3rem;
        }

        .contact a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact a:hover {
            color: var(--text-color);
        }

        /* 響應式設計，適應諸器 */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2.8rem;
            }

            p {
                font-size: 1rem;
                line-height: 2;
            }

            .works {
                margin: 2rem 0;
            }

            .motto p {
                font-size: 0.9rem;
                line-height: 1.7;
            }

            .works a {
                font-size: 0.95rem;
            }

            .contact {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            main {
                letter-spacing: 1px;
            }

            h1 {
                font-size: 2.4rem;
                margin-bottom: 1.5rem;
            }

            .motto p {
                font-size: 0.85rem;
                line-height: 1.6;
                max-width: 20em;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Javier的储物间</h1>

        <div class="motto">
            <p><em>Nothing is a waste of time if you use the experience wisely.</em></p>
        </div>


        <div class="works">
            <a href="https://nodewarden.alex25780.shop" target="_blank">NodeWarden</a>
            <a href="/card_number" target="_blank">Card Number</a>
            <a href="https://ddns.alex25780.shop:9876" target="_blank">DDNS-GO</a>
        </div>

        <div class="contact">
            <a href="mailto:iam@alex25780.shop">iam@alex25780.shop</a>
        </div>
    </main>

    <script>
        /* 隨天地而變，順自然而行 */
        function applySystemTheme() {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = prefersDark ? 'dark' : 'light';
            const themeColorMeta = document.getElementById('theme-color-meta');

            document.documentElement.setAttribute('data-theme', theme);

            if (themeColorMeta) {
                if (theme === 'dark') {
                    themeColorMeta.setAttribute('content', '#121212');
                } else {
                    themeColorMeta.setAttribute('content', '#ffffff');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applySystemTheme();

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
                    applySystemTheme();
                });
            }
        });
    </script>
</body>

</html>
